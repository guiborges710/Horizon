kind = "web"
previewPath = "/"
title = "HORIZON"
description = "A premium mobile-first augmented reality web experience that uses the phone camera, orientation, and location to reveal the next land beyond the user's horizon, with a polished Copacabana demonstration mode."
version = "1.0.0"
id = "artifacts/horizon"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18413

[services.development]
run = "pnpm --filter @workspace/horizon run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/horizon", "run", "build" ]
serve = "static"
publicDir = "artifacts/horizon/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18413"
BASE_PATH = "/"
